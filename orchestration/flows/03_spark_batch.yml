id: 03_spark_batch
namespace: omniflow.batch
description: "Triggers Apache Spark / distributed batch processing on Lake Parquet files"

tasks:
  - id: spark_batch_metrics
    type: io.kestra.plugin.scripts.python.Commands
    runner: PROCESS
    commands:
      - python batch/run_batch.py

triggers:
  - id: daily_midnight_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
